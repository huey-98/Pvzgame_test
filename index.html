<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>街区警戒线 · 僵尸生存射击</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #193246 0%, #08131c 62%, #050a0e 100%);
      color: #f4f8fb;
    }
    #game-shell { position: relative; width: min(100vw, 56.25vh); height: min(100vh, 177.7778vw); max-width: 420px; max-height: 746px; }
    canvas { display: block; width: 100%; height: 100%; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; background: #0b202c; box-shadow: 0 24px 70px rgba(0,0,0,.45); touch-action: none; }
    #start-hint { position: absolute; inset: auto 0 12px; text-align: center; color: rgba(255,255,255,.55); font-size: 11px; pointer-events: none; }
  </style>
</head>
<body>
  <main id="game-shell">
    <canvas id="game" width="360" height="640" aria-label="街区警戒线游戏画面"></canvas>
    <div id="start-hint">点击画面开始 · 战斗中点击调整方向 · 升级时点击卡片</div>
  </main>
  <script>
    "use strict";
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const TAU = Math.PI * 2;

    const COLORS = { bg: "#0b202c", text: "#f4f8fb", muted: "#9ab0bc", green: "#63e6a0", yellow: "#ffd166", red: "#ff6b6b", cyan: "#68d8ff", purple: "#c9a1ff" };
    const enemyInfo = {
      normal: { name: "普通僵尸", hp: 28, speed: 25, radius: 14, damage: 10, xp: 8, color: "#6eaa7b", accent: "#b1e4a0" },
      runner: { name: "快跑僵尸", hp: 16, speed: 52, radius: 11, damage: 7, xp: 7, color: "#e5a052", accent: "#ffe0a7" },
      bucket: { name: "铁桶僵尸", hp: 82, speed: 15, radius: 17, damage: 16, xp: 18, color: "#8290a2", accent: "#d6e0ea" },
      boss: { name: "尸潮领主", hp: 900, speed: 12, radius: 34, damage: 24, xp: 100, color: "#9d5264", accent: "#ffb0bc" }
    };

    const traits = [
      { id: "damage", name: "增伤", rarity: "普通", max: 5, icon: "✦", desc: "子弹伤害 +25%", apply: p => p.damage *= 1.25 },
      { id: "burst", name: "连发", rarity: "普通", max: 3, icon: "➤", desc: "每次多发射 1 枚子弹", apply: p => p.burst += 1 },
      { id: "firerate", name: "射速", rarity: "普通", max: 5, icon: "⚡", desc: "射击间隔 -15%", apply: p => p.fireInterval *= .85 },
      { id: "spread", name: "齐射", rarity: "稀有", max: 3, icon: "✣", desc: "左右各增加 1 条弹道", apply: p => p.spread += 1 },
      { id: "pierce", name: "穿透", rarity: "稀有", max: 4, icon: "↠", desc: "子弹额外穿透 1 个敌人", apply: p => p.pierce += 1 },
      { id: "caliber", name: "大口径", rarity: "稀有", max: 3, icon: "●", desc: "子弹更大，伤害 +15%", apply: p => { p.bulletRadius += 2; p.damage *= 1.15; } },
      { id: "crit", name: "暴击", rarity: "普通", max: 5, icon: "♦", desc: "暴击率 +12%", apply: p => p.crit += .12 },
      { id: "weakpoint", name: "弱点打击", rarity: "稀有", max: 3, icon: "☄", desc: "暴击伤害 +50%", apply: p => p.critDamage += .5 },
      { id: "burn", name: "燃烧弹", rarity: "稀有", max: 3, icon: "♨", desc: "命中后附加持续伤害", apply: p => p.burn += 1 },
      { id: "freeze", name: "冰冻弹", rarity: "稀有", max: 3, icon: "❄", desc: "命中后减速 12%", apply: p => p.freeze += .12 }
    ];

    const wavePlans = [
      { total: 12, interval: .72, mix: ["normal"] },
      { total: 18, interval: .65, mix: ["normal", "runner", "normal"] },
      { total: 20, interval: .62, mix: ["normal", "bucket", "runner"] },
      { total: 26, interval: .54, mix: ["normal", "runner", "bucket", "normal"] },
      { total: 28, interval: .5, mix: ["normal", "runner", "bucket", "runner"], boss: true }
    ];

    let state = "menu", lastTime = 0, raf = 0, upgradeCards = [], particles = [], texts = [];
    let player, bullets, enemies, game;

    function resetGame() {
      player = { x: W / 2, y: H - 76, aimAngle: -Math.PI / 2, manualAimTimer: 0, maxHp: 100, hp: 100, damage: 18, fireInterval: .52, fireTimer: .05, burst: 0, spread: 0, pierce: 0, bulletRadius: 4, crit: .08, critDamage: 1.5, burn: 0, freeze: 0, level: 1, xp: 0, nextXp: 50, traits: {} };
      bullets = []; enemies = []; particles = []; texts = [];
      game = { elapsed: 0, wave: 1, spawnCount: 0, spawnTimer: .25, bossSpawned: false, wavePause: 0, kills: 0, message: "", messageTimer: 0 };
    }

    function startGame() { resetGame(); state = "playing"; document.getElementById("start-hint").style.display = "none"; }
    function restart() { startGame(); }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function rand(a, b) { return a + Math.random() * (b - a); }
    function choose(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function formatTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }

    function spawnEnemy(type) {
      const info = enemyInfo[type];
      const e = { type, x: rand(22, W - 22), y: -info.radius - 8, hp: info.hp, maxHp: info.hp, slow: 0, burn: 0, hitFlash: 0, attackTimer: 0, phase: 0 };
      if (type === "boss") e.x = W / 2;
      enemies.push(e);
    }

    function spawnWaveEnemy() {
      const plan = wavePlans[game.wave - 1];
      if (!plan || game.spawnCount >= plan.total) return;
      const type = choose(plan.mix);
      spawnEnemy(type);
      game.spawnCount++;
      game.spawnTimer = plan.interval * rand(.7, 1.15);
    }

    function updateAim(dt) {
      if (player.manualAimTimer > 0) { player.manualAimTimer -= dt; return; }
      let target = null, bestDistance = Infinity;
      for (const e of enemies) {
        if (e.y > player.y + 40) continue;
        const distance = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
        if (distance < bestDistance) { bestDistance = distance; target = e; }
      }
      player.aimAngle = target ? Math.atan2(target.y - player.y, target.x - player.x) : -Math.PI / 2;
    }

    function setManualAim(x, y) {
      const dx = x - player.x, dy = y - player.y;
      if (dx * dx + dy * dy < 16) return;
      player.aimAngle = Math.atan2(dy, dx);
      player.manualAimTimer = 2.5;
      game.message = "手动瞄准"; game.messageTimer = .7;
    }
    function fire() {
      const count = 1 + player.burst, lanes = 1 + player.spread * 2;
      for (let b = 0; b < count; b++) {
        for (let lane = 0; lane < lanes; lane++) {
          const angle = player.aimAngle + (lanes === 1 ? 0 : (lane - (lanes - 1) / 2) * .18);
          const critical = Math.random() < player.crit;
          bullets.push({ x: player.x + (b - (count - 1) / 2) * 8, y: player.y - 21, vx: Math.cos(angle) * 300, vy: Math.sin(angle) * 300, damage: player.damage * (critical ? player.critDamage : 1), critical, radius: player.bulletRadius, pierce: player.pierce });
        }
      }
      player.fireTimer = player.fireInterval;
      for (let i = 0; i < 3; i++) particles.push({ x: player.x + rand(-5,5), y: player.y - 25, vx: rand(-20,20), vy: rand(-65,-25), life: .18, maxLife: .18, color: COLORS.yellow, size: rand(2,4) });
    }

    function gainXp(amount) {
      if (player.level >= 10) return;
      player.xp += amount;
      while (player.xp >= player.nextXp && player.level < 10) {
        player.xp -= player.nextXp; player.level++; player.nextXp = Math.floor(player.nextXp * 1.22 + 10);
        state = "upgrade"; upgradeCards = rollTraits();
        break;
      }
    }

    function rollTraits() {
      const available = traits.filter(t => (player.traits[t.id] || 0) < t.max);
      const pool = available.slice();
      const cards = [];
      while (pool.length && cards.length < 3) cards.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      return cards;
    }

    function chooseTrait(index) {
      if (state !== "upgrade" || !upgradeCards[index]) return;
      const trait = upgradeCards[index];
      player.traits[trait.id] = (player.traits[trait.id] || 0) + 1;
      trait.apply(player);
      addText(player.x, player.y - 38, `${trait.name} Lv.${player.traits[trait.id]}`, COLORS.green);
      state = "playing";
    }

    function killEnemy(index) {
      const e = enemies[index], info = enemyInfo[e.type];
      game.kills++;
      gainXp(info.xp);
      addText(e.x, e.y, `+${info.xp} XP`, COLORS.yellow);
      burst(e.x, e.y, e.type === "boss" ? 24 : 8, info.accent);
      if (e.type === "boss") { state = "victory"; game.message = "街区安全"; }
      enemies.splice(index, 1);
    }

    function damageEnemy(e, amount, bullet) {
      e.hp -= amount; e.hitFlash = .08;
      if (player.burn) e.burn = Math.max(e.burn, 1.5 + player.burn * .4);
      if (player.freeze) e.slow = Math.max(e.slow, 1.2 + player.freeze * .25);
      addText(e.x + rand(-5,5), e.y - eInfoRadius(e), bullet.critical ? `${Math.ceil(amount)} 暴击` : `${Math.ceil(amount)}`, bullet.critical ? COLORS.yellow : COLORS.text);
    }
    function eInfoRadius(e) { return enemyInfo[e.type].radius; }

    function update(dt) {
      if (state !== "playing") return;
      game.elapsed += dt;
      if (game.messageTimer > 0) game.messageTimer -= dt;
      const plan = wavePlans[game.wave - 1];
      if (plan) {
        game.spawnTimer -= dt;
        if (game.spawnTimer <= 0) spawnWaveEnemy();
        if (plan.boss && !game.bossSpawned && game.spawnCount >= plan.total && enemies.filter(e => e.type !== "boss").length < 8) { spawnEnemy("boss"); game.bossSpawned = true; game.message = "尸潮领主出现！"; game.messageTimer = 2.6; }
      }
      updateAim(dt);
      player.fireTimer -= dt; if (player.fireTimer <= 0) fire();

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
        let removed = b.y < -20 || b.x < -20 || b.x > W + 20;
        for (let j = enemies.length - 1; j >= 0 && !removed; j--) {
          const e = enemies[j], r = enemyInfo[e.type].radius + b.radius;
          if ((b.x-e.x)**2 + (b.y-e.y)**2 < r*r) {
            damageEnemy(e, b.damage, b); b.pierce--;
            if (e.hp <= 0) killEnemy(j);
            if (b.pierce < 0) removed = true;
          }
        }
        if (removed) bullets.splice(i, 1);
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i], info = enemyInfo[e.type];
        e.hitFlash = Math.max(0, e.hitFlash - dt); e.attackTimer -= dt;
        if (e.burn > 0) { e.burn -= dt; e.hp -= (10 + player.burn * 3) * dt; if (e.hp <= 0) { killEnemy(i); continue; } }
        e.slow = Math.max(0, e.slow - dt);
        const speed = info.speed * (e.slow > 0 ? .58 : 1) * (e.type === "boss" && e.hp < e.maxHp * .5 ? 1.5 : 1);
        const attackY = player.y - info.radius - 19;
        const inPlayerLane = Math.abs(e.x - player.x) <= info.radius + 19;
        if (inPlayerLane && e.y >= attackY) {
          e.y = attackY;
          if (e.attackTimer <= 0) { player.hp -= info.damage; e.attackTimer = e.type === "boss" ? .65 : 1.0; burst(player.x, player.y, 4, COLORS.red); addText(player.x, player.y - 25, `-${info.damage}`, COLORS.red); if (player.hp <= 0) { player.hp = 0; state = "defeat"; } }
        } else {
          e.y += speed * dt;
          if (e.y > H + info.radius + 24) { enemies.splice(i, 1); continue; }
        }
      }
      updateEffects(dt);
      if (state === "playing" && plan && game.spawnCount >= plan.total && enemies.length === 0 && (!plan.boss || game.bossSpawned)) {
        if (game.wave >= wavePlans.length) state = "victory";
        else { game.wave++; game.spawnCount = 0; game.spawnTimer = 1.4; game.bossSpawned = false; game.message = `第 ${game.wave} 波`; game.messageTimer = 1.8; }
      }
    }

    function burst(x, y, count, color) { for (let i=0;i<count;i++) { const a=rand(0,TAU), s=rand(25,105); particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.65),maxLife:.65,color,size:rand(1.5,4)}); } }
    function addText(x,y,text,color) { texts.push({x,y,text,color,life:1}); }
    function updateEffects(dt) { for (const p of particles) { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 35*dt; p.life -= dt; } particles = particles.filter(p=>p.life>0); for (const t of texts) { t.y -= 24*dt; t.life -= dt; } texts = texts.filter(t=>t.life>0); }

    function draw() {
      drawBackground(); drawEnemies(); drawBullets(); drawPlayer(); drawEffects(); drawHud();
      if (state === "menu") drawMenu();
      if (state === "upgrade") drawUpgrade();
      if (state === "victory" || state === "defeat") drawResult();
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,"#102d3b"); grad.addColorStop(1,"#08151d"); ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle="rgba(153,205,218,.07)"; ctx.lineWidth=1;
      for(let x=15;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=86;y<H;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      ctx.fillStyle="rgba(255,255,255,.025)"; for(let i=0;i<7;i++) ctx.fillRect((i*67+18)%W, 125+(i*83)%H, 26, 10);
      const lineY = player ? player.y + 24 : H-52; ctx.strokeStyle="rgba(255,107,107,.3)"; ctx.setLineDash([5,7]); ctx.beginPath();ctx.moveTo(0,lineY);ctx.lineTo(W,lineY);ctx.stroke();ctx.setLineDash([]);
    }
    function drawPlayer() {
      if (!player) return; const x=player.x,y=player.y;
      ctx.save(); ctx.translate(x,y); ctx.fillStyle="rgba(0,0,0,.3)"; ctx.beginPath();ctx.ellipse(0,17,29,8,0,0,TAU);ctx.fill();
      ctx.fillStyle="#4a8fb4"; ctx.beginPath();ctx.arc(0,4,18,0,TAU);ctx.fill(); ctx.fillStyle="#a9d9eb";ctx.beginPath();ctx.arc(0,-8,10,0,TAU);ctx.fill();
      ctx.fillStyle="#253746";ctx.fillRect(-10,-15,20,6); ctx.save();ctx.rotate(player.aimAngle + Math.PI / 2);ctx.fillStyle="#f7cc78";ctx.fillRect(-2,-38,4,25);ctx.fillStyle="#ffd166";ctx.beginPath();ctx.arc(0,-40,4,0,TAU);ctx.fill();ctx.restore();
      ctx.restore();
    }
    function drawBullets() { for (const b of bullets) { ctx.fillStyle=b.critical?COLORS.yellow:COLORS.cyan; ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,TAU);ctx.fill();ctx.shadowBlur=0; } }
    function drawEnemies() { for (const e of enemies) { const info=enemyInfo[e.type]; ctx.save();ctx.translate(e.x,e.y); if(e.hitFlash>0)ctx.globalAlpha=.45;
      ctx.fillStyle="rgba(0,0,0,.28)";ctx.beginPath();ctx.ellipse(0,info.radius*.82,info.radius*1.1,info.radius*.38,0,0,TAU);ctx.fill();
      ctx.fillStyle=info.color;ctx.beginPath();ctx.arc(0,0,info.radius,0,TAU);ctx.fill();ctx.fillStyle=info.accent;ctx.beginPath();ctx.arc(-info.radius*.3,-info.radius*.22,info.radius*.18,0,TAU);ctx.arc(info.radius*.3,-info.radius*.22,info.radius*.18,0,TAU);ctx.fill();
      ctx.fillStyle="#17252b";ctx.beginPath();ctx.arc(-info.radius*.3,-info.radius*.22,info.radius*.08,0,TAU);ctx.arc(info.radius*.3,-info.radius*.22,info.radius*.08,0,TAU);ctx.fill();
      if(e.type==="bucket"){ctx.fillStyle="#4f6272";ctx.fillRect(-info.radius*.7,-info.radius*1.1,info.radius*1.4,info.radius*.42);}
      if(e.type==="boss"){ctx.strokeStyle=COLORS.red;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,info.radius+4,0,TAU);ctx.stroke();}
      ctx.restore();
      if(e.type!=="boss"){ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(e.x-info.radius,e.y-info.radius-8,info.radius*2,3);ctx.fillStyle=COLORS.green;ctx.fillRect(e.x-info.radius,e.y-info.radius-8,info.radius*2*clamp(e.hp/e.maxHp,0,1),3);}
    } }
    function drawEffects(){ for(const p of particles){ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();} ctx.globalAlpha=1; for(const t of texts){ctx.globalAlpha=clamp(t.life,0,1);ctx.fillStyle=t.color;ctx.font="bold 11px Segoe UI, Microsoft YaHei";ctx.textAlign="center";ctx.fillText(t.text,t.x,t.y);}ctx.globalAlpha=1; }

    function roundedRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
    function drawHud(){ if(!player || state==="menu") return; ctx.textAlign="left";ctx.fillStyle=COLORS.text;ctx.font="bold 13px Segoe UI, Microsoft YaHei";ctx.fillText(`生命 ${Math.ceil(player.hp)} / ${player.maxHp}`,16,25);ctx.textAlign="right";ctx.fillText(`第 ${game.wave} / ${wavePlans.length} 波`,W-16,25);
      roundedRect(16,34,150,8,4,"rgba(255,255,255,.16)");roundedRect(16,34,150*clamp(player.hp/player.maxHp,0,1),8,4,COLORS.red);
      ctx.textAlign="center";ctx.fillStyle=COLORS.text;ctx.font="bold 11px Segoe UI, Microsoft YaHei";ctx.fillText(`等级 ${player.level}${player.level>=10?" · MAX":""}`,W/2,25);
      roundedRect(16,49,W-32,7,4,"rgba(255,255,255,.12)");roundedRect(16,49,(W-32)*clamp(player.xp/player.nextXp,0,1),7,4,COLORS.cyan);ctx.fillStyle=COLORS.muted;ctx.font="10px Segoe UI, Microsoft YaHei";ctx.fillText(`${player.level>=10?"经验已满":"经验 " + Math.floor(player.xp)+" / "+player.nextXp}`,W/2,68);
      const alive=enemies.length;ctx.textAlign="left";ctx.fillStyle=COLORS.muted;ctx.fillText(`击杀 ${game.kills}`,16,88);ctx.textAlign="right";ctx.fillText(`场上 ${alive}`,W-16,88);
      if(game.messageTimer>0){ctx.textAlign="center";ctx.font="bold 18px Segoe UI, Microsoft YaHei";ctx.fillStyle=COLORS.yellow;ctx.fillText(game.message,W/2,125);}
      if(enemies.some(e=>e.type==="boss")){const b=enemies.find(e=>e.type==="boss");ctx.fillStyle=COLORS.text;ctx.textAlign="center";ctx.font="bold 11px Segoe UI, Microsoft YaHei";ctx.fillText("尸潮领主",W/2,104);roundedRect(44,110,W-88,9,5,"rgba(0,0,0,.45)");roundedRect(44,110,(W-88)*clamp(b.hp/b.maxHp,0,1),9,5,COLORS.red);}
    }

    function overlay(){ctx.fillStyle="rgba(3,9,13,.78)";ctx.fillRect(0,0,W,H);}
    function drawMenu(){overlay();ctx.textAlign="center";ctx.fillStyle=COLORS.yellow;ctx.font="bold 30px Segoe UI, Microsoft YaHei";ctx.fillText("街区警戒线",W/2,170);ctx.fillStyle=COLORS.text;ctx.font="15px Segoe UI, Microsoft YaHei";ctx.fillText("竖屏僵尸生存射击",W/2,199);ctx.fillStyle=COLORS.muted;ctx.font="12px Segoe UI, Microsoft YaHei";ctx.fillText("步枪会自动锁定最近目标",W/2,245);ctx.fillText("战斗中点击画面可手动调整射击方向",W/2,267);button(W/2-82,318,164,48,"开始战斗",COLORS.green);ctx.fillStyle=COLORS.muted;ctx.font="11px Segoe UI, Microsoft YaHei";ctx.fillText("共 5 波 · 最后一波击败 Boss 即可胜利",W/2,402);}
    function button(x,y,w,h,label,color){roundedRect(x,y,w,h,12,color);ctx.textAlign="center";ctx.fillStyle="#071217";ctx.font="bold 15px Segoe UI, Microsoft YaHei";ctx.fillText(label,x+w/2,y+h/2+5);}
    function drawUpgrade(){overlay();ctx.textAlign="center";ctx.fillStyle=COLORS.yellow;ctx.font="bold 25px Segoe UI, Microsoft YaHei";ctx.fillText("等级提升！",W/2,112);ctx.fillStyle=COLORS.text;ctx.font="12px Segoe UI, Microsoft YaHei";ctx.fillText("选择一项强化，战斗将继续",W/2,137);
      const cardW=98,gap=8,start=(W-cardW*3-gap*2)/2; upgradeCards.forEach((t,i)=>{const x=start+i*(cardW+gap),y=190,lv=player.traits[t.id]||0;roundedRect(x,y,cardW,218,14,"#163343","rgba(165,219,232,.25)");ctx.fillStyle=t.rarity==="稀有"?COLORS.purple:COLORS.cyan;ctx.font="bold 31px Segoe UI, Microsoft YaHei";ctx.fillText(t.icon,x+cardW/2,y+50);ctx.fillStyle=COLORS.text;ctx.font="bold 14px Segoe UI, Microsoft YaHei";ctx.fillText(t.name,x+cardW/2,y+82);ctx.fillStyle=t.rarity==="稀有"?COLORS.purple:COLORS.green;ctx.font="bold 11px Segoe UI, Microsoft YaHei";ctx.fillText(`${t.rarity} · Lv.${lv+1}/${t.max}`,x+cardW/2,y+104);ctx.fillStyle=COLORS.muted;ctx.font="11px Segoe UI, Microsoft YaHei";wrapText(t.desc,x+cardW/2,y+135,78,16);roundedRect(x+17,y+181,64,27,8,"#24546a");ctx.fillStyle=COLORS.text;ctx.font="bold 11px Segoe UI, Microsoft YaHei";ctx.fillText("选择",x+cardW/2,y+199);});
    }
    function wrapText(text,x,y,maxWidth,lineHeight){const words=[...text];let line="",lines=[];for(const char of words){if(ctx.measureText(line+char).width>maxWidth){lines.push(line);line=char;}else line+=char;}if(line)lines.push(line);lines.slice(0,3).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));}
    function drawResult(){overlay();ctx.textAlign="center";const win=state==="victory";ctx.fillStyle=win?COLORS.green:COLORS.red;ctx.font="bold 31px Segoe UI, Microsoft YaHei";ctx.fillText(win?"关卡胜利":"战斗失败",W/2,175);ctx.fillStyle=COLORS.text;ctx.font="15px Segoe UI, Microsoft YaHei";ctx.fillText(win?"你守住了街区警戒线":"尸潮突破了防线",W/2,207);ctx.fillStyle=COLORS.muted;ctx.font="13px Segoe UI, Microsoft YaHei";ctx.fillText(`用时 ${formatTime(game.elapsed)}  ·  击杀 ${game.kills}  ·  等级 ${player.level}`,W/2,258);button(W/2-82,315,164,48,"重新开始",win?COLORS.green:COLORS.yellow);}

    function pointerPosition(ev){const r=canvas.getBoundingClientRect();return {x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height};}
    canvas.addEventListener("pointerdown", ev=>{ev.preventDefault();const p=pointerPosition(ev);
      if(state==="menu"){if(p.x>W/2-100&&p.x<W/2+100&&p.y>290&&p.y<390)startGame();return;}
      if(state==="upgrade"){const cardW=98,gap=8,start=(W-cardW*3-gap*2)/2;for(let i=0;i<3;i++){const x=start+i*(cardW+gap);if(p.x>=x&&p.x<=x+cardW&&p.y>=175&&p.y<=430){chooseTrait(i);return;}}return;}
      if(state==="victory"||state==="defeat"){if(p.x>W/2-105&&p.x<W/2+105&&p.y>290&&p.y<390)restart();return;}
      if(state==="playing") setManualAim(p.x, p.y);
    });

    function loop(time){const dt=Math.min(.033,(time-lastTime)/1000||0);lastTime=time;update(dt);draw();raf=requestAnimationFrame(loop);}
    resetGame(); requestAnimationFrame(loop);
  </script>
</body>
</html>
